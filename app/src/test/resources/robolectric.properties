# Robolectric runs against the SDK it is told to, and otherwise against the variant's targetSdk.
# That made the test result depend on which flavour was building: fullCli targets 28 and passed,
# play targets 36, and Robolectric 4.16 ships no android-all jar for 36 -- so four tests that
# declared no @Config died with UnsupportedOperationException on CI while passing locally.
#
# Pinning it here makes every Robolectric test run against one SDK regardless of flavour, and
# regardless of what targetSdk becomes next. 34 is the newest Robolectric supports fully.
sdk=34
