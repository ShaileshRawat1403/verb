<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Verb · Desktop workbench concept</title>
  <style>
    :root{color-scheme:dark;--bg:#0c1016;--chrome:#11161f;--surface:#171d28;--raised:#1d2532;--line:#303a49;--text:#e9edf5;--sub:#a5afbf;--quiet:#758195;--violet:#9a96ff;--cyan:#63c9e9;--green:#8bddb5;--yellow:#f1cb7c;--red:#f49c9d;--font:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;--mono:"SFMono-Regular",Consolas,"Liberation Mono",monospace}
    *{box-sizing:border-box}body{margin:0;background:#080b10;color:var(--text);font-family:var(--font)}button,textarea{font:inherit}button{cursor:pointer}button:focus-visible,textarea:focus-visible{outline:2px solid var(--cyan);outline-offset:2px}button:disabled{cursor:not-allowed;opacity:.55}
    .app{width:100%;min-height:100vh;background:var(--bg);display:flex;flex-direction:column;overflow:hidden}.topbar{height:61px;background:var(--chrome);border-bottom:1px solid #26303d;display:flex;align-items:center;gap:18px;padding:0 28px;flex:none}.brand{display:flex;align-items:center;gap:9px;font-family:var(--mono);font-size:20px;font-weight:700;letter-spacing:-1px;color:#eef1fa}.brand-mark{display:inline-flex;align-items:end;color:var(--violet);font-size:25px;line-height:1}.brand-cursor{display:block;width:8px;height:11px;background:var(--cyan);margin-left:-7px;margin-bottom:3px}.top-divider{width:1px;height:25px;background:var(--line)}.project{display:flex;align-items:center;gap:11px;min-width:0}.folder{color:var(--quiet);font-size:18px}.project-name{font-weight:600;white-space:nowrap}.branch{font-family:var(--mono);font-size:12px;color:var(--sub);background:#212a37;padding:5px 8px;border-radius:5px;white-space:nowrap}.top-spacer{flex:1}.top-help{font-size:12px;color:var(--quiet);white-space:nowrap}.top-action{background:#242b39;color:var(--text);border:1px solid #3a4354;border-radius:7px;padding:8px 12px;display:flex;align-items:center;gap:8px;font-size:13px;font-weight:600}.top-action:hover{background:#30384a}.top-action b{font-family:var(--mono);font-size:11px;color:var(--sub);font-weight:500}.attention-dot{width:7px;height:7px;background:var(--yellow);border-radius:50%}
    .terminal-head{display:flex;align-items:center;gap:2px;background:#121820;border-bottom:1px solid #27303d;padding:8px 19px 0;min-height:48px;flex:none}.terminal-tab{display:flex;align-items:center;gap:8px;background:none;color:var(--sub);border:0;border-bottom:2px solid transparent;padding:9px 17px 12px;font-size:13px}.terminal-tab:hover{color:var(--text)}.terminal-tab.selected{color:var(--text);border-color:var(--violet);background:#19202b}.tab-state{font-size:11px;color:var(--green)}.tab-state.recoverable{color:var(--yellow)}.tab-state.unknown{color:var(--quiet)}.terminal-head .spacer{flex:1}.new-session{background:none;border:0;color:var(--sub);font-size:22px;padding:4px 13px 9px}.new-session:hover{color:var(--text)}.terminal{flex:1;position:relative;padding:36px 42px 95px;background:radial-gradient(circle at 80% 15%,rgba(62,76,106,.08),transparent 39%),var(--bg);font-family:var(--mono);font-size:13px;line-height:1.8;color:#c7d4df;overflow:auto;min-height:450px}.terminal .muted{color:#8c9aad}.terminal .green{color:var(--green)}.terminal .violet{color:#b7b2ff}.terminal .cyan{color:var(--cyan)}.terminal .prompt{color:var(--green)}.cursor{display:inline-block;width:8px;height:15px;background:#d7e5f1;vertical-align:-3px;animation:blink 1.1s steps(1) infinite}@keyframes blink{50%{opacity:0}}.terminal-lines{white-space:pre-wrap;max-width:950px}.statusline{height:39px;display:flex;align-items:center;justify-content:space-between;gap:20px;background:#11161e;border-top:1px solid #28313c;padding:0 29px;color:#99a7b6;font:12px var(--mono);flex:none}.statusline strong{color:#d6dce6;font-weight:500}.statusline .key{color:#d4ceff}.statusline .right{white-space:nowrap}
    .backdrop{position:fixed;inset:61px 0 39px;background:rgba(3,7,12,.65);backdrop-filter:blur(2px);z-index:4}.backdrop[hidden],.workbench[hidden]{display:none}.workbench{position:fixed;z-index:5;left:50%;top:50%;transform:translate(-50%,-50%);width:min(1120px,calc(100vw - 58px));height:min(685px,calc(100vh - 112px));min-height:500px;background:var(--surface);border:1px solid #455064;border-radius:12px;box-shadow:0 28px 100px rgba(0,0,0,.55);display:flex;flex-direction:column;overflow:hidden}.wb-head{height:72px;display:flex;align-items:center;gap:16px;padding:0 24px;border-bottom:1px solid var(--line);flex:none}.wb-title{font-size:20px;font-weight:650;letter-spacing:-.4px}.wb-meta{font-size:12px;color:var(--sub)}.wb-head .spacer{flex:1}.wb-view{color:var(--sub);font-size:12px;font-family:var(--mono);background:#242d3a;padding:7px 9px;border-radius:5px}.icon-button{border:0;background:transparent;color:var(--sub);font-size:22px;width:36px;height:36px;border-radius:6px}.icon-button:hover{background:#2a3443;color:var(--text)}.wb-body{min-height:0;flex:1;display:grid;grid-template-columns:356px minmax(0,1fr)}.queue{border-right:1px solid var(--line);overflow:auto;background:#151b25}.queue-intro{padding:21px 20px 14px;display:flex;align-items:center;justify-content:space-between;color:var(--sub);font-size:12px;font-weight:600;letter-spacing:.09em;text-transform:uppercase}.count{font-family:var(--mono);color:var(--quiet);font-weight:500}.task-row{width:100%;display:block;text-align:left;border:0;border-left:3px solid transparent;border-bottom:1px solid #2a3340;background:transparent;color:var(--text);padding:17px 19px 18px 17px}.task-row:hover{background:#212a37}.task-row.selected{background:#273143;border-left-color:var(--violet)}.task-row .row-top{display:flex;align-items:center;justify-content:space-between;gap:8px}.task-row .title{font-size:14px;font-weight:620;line-height:1.4}.task-row .index{font:11px var(--mono);color:var(--quiet)}.task-row .row-bottom{display:flex;align-items:center;gap:8px;margin-top:11px;font-size:11px;color:var(--sub)}.sep{color:#657285}.pill{display:inline-flex;align-items:center;gap:5px;border-radius:4px;font-size:11px;font-weight:600;padding:4px 7px}.pill.review{color:var(--yellow);background:#403626}.pill.help{color:var(--red);background:#432d35}.pill.active{color:var(--green);background:#253d38}.pill.open{color:#b5c4d4;background:#2b3847}.pill.done{color:var(--sub);background:#29313d}.detail{min-width:0;display:flex;flex-direction:column;overflow:auto}.detail-scroll{overflow:auto;flex:1;padding:25px 30px 20px}.detail-kicker{display:flex;align-items:center;gap:9px;margin-bottom:12px}.task-id{font:11px var(--mono);color:var(--quiet)}.detail-title{font-size:23px;font-weight:650;letter-spacing:-.5px;margin:0 0 13px;line-height:1.25}.owner-row{display:flex;align-items:center;gap:8px;color:var(--sub);font-size:12px;margin-bottom:24px}.owner-row strong{color:var(--text);font-weight:550}.avatar{width:20px;height:20px;display:grid;place-items:center;border-radius:5px;background:#463c3d;color:#f0cbbb;font:11px var(--mono)}.avatar.codex{background:#294147;color:#afe4db}.section-label{color:#9ba8b9;font-size:11px;text-transform:uppercase;letter-spacing:.11em;font-weight:650;margin:0 0 9px}.brief{font-size:13px;line-height:1.6;color:#d4dce7;margin:0 0 23px;max-width:680px}.callout{border-left:2px solid var(--yellow);background:#2c2b2c;padding:11px 13px;margin:0 0 23px}.callout .label{font-size:11px;font-weight:650;color:var(--yellow);margin-bottom:6px}.callout p{margin:0;font-size:12px;line-height:1.55;color:#dce2e9}.timeline{display:flex;flex-direction:column;gap:0;margin-top:4px}.event{display:grid;grid-template-columns:13px 1fr;gap:12px;position:relative;padding-bottom:15px}.event:not(:last-child):before{content:"";position:absolute;left:5px;top:12px;bottom:0;width:1px;background:#3c4758}.event-dot{width:11px;height:11px;border:2px solid #808ca1;border-radius:50%;margin-top:4px;background:var(--surface);z-index:1}.event:first-child .event-dot{border-color:var(--violet);background:var(--violet)}.event-title{font-size:12px;color:#e1e7ef;font-weight:600}.event-time{font:11px var(--mono);color:var(--quiet);font-weight:400;margin-left:8px}.event-note{font-size:12px;color:var(--sub);line-height:1.48;margin-top:4px}.memory-link{background:transparent;border:0;padding:0;color:var(--cyan);font-size:12px;text-align:left;margin-top:4px}.memory-link:hover{text-decoration:underline}.memory-panel{margin-top:12px;background:#202a36;padding:12px 14px;font:11px/1.65 var(--mono);color:#bdc9d8;white-space:pre-wrap}.detail-foot{flex:none;border-top:1px solid var(--line);background:#1b2330;padding:15px 29px;display:flex;align-items:center;gap:10px;min-height:67px}.primary{background:#aaa5ff;color:#171724;border:1px solid #c0bdff;border-radius:6px;padding:9px 14px;font-size:12px;font-weight:700}.primary:hover{background:#c2beff}.secondary{background:#2a3544;color:#e5ebf4;border:1px solid #465468;border-radius:6px;padding:9px 12px;font-size:12px;font-weight:600}.secondary:hover{background:#354358}.foot-help{margin-left:auto;color:var(--quiet);font:11px var(--mono)}.composer{display:none;flex-direction:column;gap:9px;width:100%}.composer.open{display:flex}.composer label{font-size:12px;color:var(--text);font-weight:600}.composer textarea{width:100%;min-height:72px;resize:vertical;border:1px solid #536078;background:#121923;color:var(--text);border-radius:5px;padding:10px 11px;font-size:12px;line-height:1.5}.composer-actions{display:flex;align-items:center;gap:8px}.composer .hint{margin-left:auto;color:var(--quiet);font-size:11px}.toast{position:fixed;z-index:12;bottom:57px;left:50%;transform:translateX(-50%);background:#283b38;color:#d7f4e8;border:1px solid #4a8b78;padding:10px 14px;border-radius:7px;font-size:12px;box-shadow:0 10px 30px #0007;display:none}.toast.show{display:block}
    @media(max-width:850px){.top-help,.branch{display:none}.workbench{width:calc(100vw - 24px);height:calc(100vh - 86px);min-height:0}.wb-body{grid-template-columns:275px minmax(0,1fr)}.detail-scroll{padding:20px}.detail-foot{padding:13px 20px}.terminal{padding:25px 23px}}
    @media(max-width:650px){.topbar{padding:0 14px;gap:10px}.project-name{max-width:120px;overflow:hidden;text-overflow:ellipsis}.top-action b{display:none}.workbench{top:53%;height:calc(100vh - 90px)}.wb-head{height:61px;padding:0 14px}.wb-meta,.wb-view{display:none}.wb-body{display:flex;flex-direction:column}.queue{display:flex;flex:none;overflow:auto;max-height:190px;border-right:0;border-bottom:1px solid var(--line)}.queue-intro{display:none}.task-row{min-width:200px;border-bottom:0;border-left:0;border-top:3px solid transparent;padding:12px}.task-row.selected{border-top-color:var(--violet)}.detail-scroll{padding:18px}.detail-title{font-size:19px}.foot-help{display:none}}
    @media(prefers-reduced-motion:reduce){.cursor{animation:none}}
  </style>
</head>
<body>
<div class="app">
  <header class="topbar"><div class="brand" aria-label="Verb"><span class="brand-mark">∨</span>erb<span class="brand-cursor"></span></div><div class="top-divider"></div><div class="project"><span class="folder">⌁</span><span class="project-name">verb</span><span class="branch">main · clean</span></div><div class="top-spacer"></div><span class="top-help">Ctrl+Space opens commands</span><button class="top-action" id="tasks-button" type="button"><span class="attention-dot"></span> Tasks <b>2 need you</b></button></header>
  <div class="terminal-head" role="tablist" aria-label="Agent sessions"><button class="terminal-tab selected" type="button" role="tab" aria-selected="true" data-session="claude">Claude <span class="tab-state">● running</span></button><button class="terminal-tab" type="button" role="tab" aria-selected="false" data-session="codex">Codex <span class="tab-state recoverable">◐ recoverable</span></button><button class="terminal-tab" type="button" role="tab" aria-selected="false" data-session="opencode">OpenCode <span class="tab-state unknown">◌ checking</span></button><span class="spacer"></span><button class="new-session" type="button" id="new-session" aria-label="New session">+</button></div>
  <main class="terminal" aria-label="Terminal"><div class="terminal-lines" id="terminal-lines"></div></main>
  <footer class="statusline"><span><strong>verb</strong> &nbsp; ~/code/verb &nbsp; · &nbsp; <span id="status-agent">claude</span> &nbsp; <span class="green" id="status-state">● running</span></span><span class="right"><span class="key">Ctrl+Space</span> commands &nbsp; · &nbsp; <span class="key">Esc</span> close surface</span></footer>
</div>
<div class="backdrop" id="backdrop"></div>
<section class="workbench" id="workbench" role="dialog" aria-modal="true" aria-labelledby="wb-title">
  <header class="wb-head"><div><div class="wb-title" id="wb-title">Tasks &amp; handoffs</div><div class="wb-meta">One project · four tasks · two need attention</div></div><span class="spacer"></span><span class="wb-view">interactive concept · local only</span><button class="icon-button" id="close-workbench" type="button" aria-label="Close tasks and return to terminal">×</button></header>
  <div class="wb-body"><nav class="queue" aria-label="Project tasks"><div class="queue-intro"><span>Project work</span><span class="count">04</span></div><div id="task-list"></div></nav><article class="detail" aria-live="polite"><div class="detail-scroll" id="task-detail"></div><div class="detail-foot" id="detail-foot"></div></article></div>
</section>
<div class="toast" id="toast" role="status"></div>
<script>
(() => {
  const tasks = [
    {id:'f3a72c91',title:'Review session lock recovery',status:'review',owner:null,from:'Claude',brief:'Confirm that an agent cannot be resumed twice after the Verb host crashes. Review the process lock test and the recovery transition before marking this complete.',handoff:'Claude finished the lock inheritance and crash test. Please check the release path and the exact resume guard.',events:[['Claude handed off for review','4 min ago','Lock inheritance and crash test are ready.'],['Claude claimed this task','42 min ago','Started with the duplicate resume race.']]},
    {id:'a19e8704',title:'Verify OpenCode WAL fallback',status:'help',owner:'Codex',brief:'Check that a missing OpenCode conversation remains unconfirmed while SQLite has an uncheckpointed WAL.',handoff:'Codex asked: Can you check the WAL race against a live OpenCode database?',events:[['Codex asked for help','12 min ago','Can you check the WAL race against a live OpenCode database?'],['Codex claimed this task','29 min ago','Reading the recovery adapter.']]},
    {id:'d72183b6',title:'Design the task workbench',status:'active',owner:'Claude',brief:'Create a task surface that keeps the terminal primary, makes handoffs unmistakable, and gives people a clear way back to the exact session.',handoff:null,events:[['Claude claimed this task','18 min ago','Starting with the task list and detail journey.']]},
    {id:'9c0af284',title:'Write the recovery guide',status:'open',owner:null,brief:'Document the difference between a durable Verb session, local agent conversation evidence, and source or continuity exports.',handoff:null,events:[['Task created','1 hr ago','No session has claimed this task yet.']]}
  ];
  const labels={review:'Needs review',help:'Help requested',active:'In progress',open:'Open',done:'Done'};
  const sessionLines={
    claude:'<span class="muted">Session s-8f21 · project ~/code/verb · started 10:42</span>\n\n<span class="violet">claude</span>  I finished the session lock recovery path.\n\n<span class="green">✓</span>  cargo test --all-targets         133 passed\n<span class="green">✓</span>  cargo clippy --all-targets       clean\n<span class="green">✓</span>  cargo build --release           finished\n\nReview handoff recorded on task <span class="cyan">f3a72c91</span>.\nThe exact conversation ID remains available for resume.\n\n<span class="prompt">~/code/verb</span> $ <span class="cursor"></span>',
    codex:'<span class="muted">Session s-7b10 · project ~/code/verb · last seen 10:31</span>\n\n<span class="violet">codex</span>  I checked the OpenCode recovery adapter.\n\nThe SQLite WAL may hold a newer message than an immutable read can see.\nI requested a second review on task <span class="cyan">a19e8704</span>.\n\n<span class="muted">Conversation available · choose Resume to return to this exact session.</span>',
    opencode:'<span class="muted">Session s-21be · project ~/code/verb</span>\n\n<span class="violet">opencode</span>  Recovery evidence is being checked.\n\n<span class="muted">Verb will not guess a conversation or resume the latest one.</span>'
  };
  const $=id=>document.getElementById(id);
  let selected=0, session='claude', composer=null, memoryOpen=false, toastTimer;
  const escape=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  function statusClass(t){return t.status==='help'?'help':t.status}
  function list(){ $('task-list').innerHTML=tasks.map((t,i)=>`<button class="task-row ${i===selected?'selected':''}" type="button" data-task="${i}" aria-current="${i===selected?'true':'false'}"><span class="row-top"><span class="title">${escape(t.title)}</span><span class="index">0${i+1}</span></span><span class="row-bottom"><span class="pill ${statusClass(t)}">${labels[t.status]}</span><span class="sep">·</span><span>${escape(t.owner||'Unassigned')}</span></span></button>`).join(''); }
  function details(){const t=tasks[selected]; const owner=t.owner?`<span class="avatar ${t.owner==='Codex'?'codex':''}">${t.owner[0]}</span><strong>${escape(t.owner)}</strong><span>owns this task · session ${t.owner==='Codex'?'s-7b10':'s-8f21'}</span>`:`<strong>No owner</strong><span>· ready for a session to claim</span>`;
    const callout=t.handoff?`<div class="callout"><div class="label">${t.status==='review'?'REVIEW HANDOFF':t.status==='help'?'HELP REQUEST':'LATEST NOTE'}</div><p>${escape(t.handoff)}</p></div>`:'';
    $('task-detail').innerHTML=`<div class="detail-kicker"><span class="pill ${statusClass(t)}">${labels[t.status]}</span><span class="task-id">${t.id}</span></div><h1 class="detail-title">${escape(t.title)}</h1><div class="owner-row">${owner}</div><h2 class="section-label">Brief</h2><p class="brief">${escape(t.brief)}</p>${callout}<h2 class="section-label">Activity</h2><div class="timeline">${t.events.map(e=>`<div class="event"><span class="event-dot"></span><div><span class="event-title">${escape(e[0])}</span><span class="event-time">${escape(e[1])}</span><div class="event-note">${escape(e[2])}</div></div></div>`).join('')}</div><button type="button" class="memory-link" id="memory-toggle" aria-expanded="${memoryOpen}">${memoryOpen?'Hide':'Show'} shared project memory ↗</button>${memoryOpen?'<div class="memory-panel">Project conventions\n• Rust desktop host owns task and session metadata.\n• Resume only by a verified conversation ID.\n• Run desktop tests before a review handoff.</div>':''}`;
    const buttons=t.status==='review'?'<button class="primary" data-action="claim-review">Claim review as Codex</button><button class="secondary" data-action="reassign">Reassign…</button>':t.status==='help'?'<button class="primary" data-action="reply">Reply to help request</button><button class="secondary" data-action="reassign">Reassign…</button>':t.status==='active'?'<button class="primary" data-action="handoff">Hand off for review</button><button class="secondary" data-action="request-help">Request help…</button><button class="secondary" data-action="reassign">Reassign…</button>':t.status==='open'?'<button class="primary" data-action="claim">Claim as Claude</button>':'<button class="secondary" data-action="reopen">View history</button>';
    $('detail-foot').innerHTML=composer?`<div class="composer open"><label for="note">${composer==='reply'?'Reply to Codex':composer==='request-help'?'Ask another session for help':composer==='handoff'?'Review handoff':composer==='reassign'?'Reason for reassignment':'Note'}</label><textarea id="note" placeholder="Write a specific note for the next agent…"></textarea><div class="composer-actions"><button class="primary" type="button" id="save-note">Record ${composer==='reassign'?'reassignment':'note'}</button><button class="secondary" type="button" id="cancel-note">Cancel</button><span class="hint">Saved to task history in the product</span></div></div>`:`${buttons}<span class="foot-help">Esc returns to terminal</span>`;
  }
  function render(){list();details();}
  function notify(message){const node=$('toast');node.textContent=message;node.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>node.classList.remove('show'),2900)}
  function close(){ $('workbench').hidden=true;$('backdrop').hidden=true;$('tasks-button').focus(); }
  function open(){ $('workbench').hidden=false;$('backdrop').hidden=false;render();$('close-workbench').focus(); }
  function action(kind){const t=tasks[selected];if(['reply','request-help','handoff','reassign'].includes(kind)){composer=kind;details();$('note').focus();return;}if(kind==='claim-review'){t.status='active';t.owner='Codex';t.handoff=null;t.events.unshift(['Codex claimed the review','just now','Review in progress; completion still requires a separate decision.']);notify('Review claimed by Codex. The task is not complete.')}else if(kind==='claim'){t.status='active';t.owner='Claude';t.events.unshift(['Claude claimed this task','just now','Owner recorded.']);notify('Task claimed by Claude.')}render();}
  function saveNote(){const note=$('note').value.trim();if(!note){$('note').focus();notify('Write a note before recording this action.');return;}const t=tasks[selected];if(composer==='reply'){t.handoff=null;t.status='active';t.events.unshift(['Claude replied to help request','just now',note]);notify('Reply recorded. Codex still owns this task.')}else if(composer==='request-help'){t.handoff=`${t.owner} asked: ${note}`;t.status='help';t.events.unshift([`${t.owner} asked for help`,'just now',note]);notify('Help request recorded.')}else if(composer==='handoff'){t.handoff=`${t.owner} handed off: ${note}`;t.events.unshift([`${t.owner} handed off for review`,'just now',note]);t.owner=null;t.status='review';notify('Review handoff recorded. Task awaits a reviewer.')}else if(composer==='reassign'){const previous=t.owner||'unassigned';t.owner=previous==='Codex'?'Claude':'Codex';t.status='active';t.handoff=null;t.events.unshift([`Task reassigned to ${t.owner}`,'just now',`${note} · previous owner: ${previous}`]);notify(`Reassigned to ${t.owner}; the reason is in history.`)}composer=null;render();}
  document.addEventListener('click',e=>{const task=e.target.closest('[data-task]');if(task){selected=Number(task.dataset.task);composer=null;memoryOpen=false;render();return;}const target=e.target.closest('[data-action]');if(target){action(target.dataset.action);return;}if(e.target.id==='memory-toggle'){memoryOpen=!memoryOpen;details();return;}if(e.target.id==='save-note'){saveNote();return;}if(e.target.id==='cancel-note'){composer=null;details();return;}const tab=e.target.closest('[data-session]');if(tab){session=tab.dataset.session;document.querySelectorAll('.terminal-tab').forEach(x=>{const yes=x===tab;x.classList.toggle('selected',yes);x.setAttribute('aria-selected',String(yes))});$('terminal-lines').innerHTML=sessionLines[session];$('status-agent').textContent=session;$('status-state').textContent=tab.querySelector('.tab-state').textContent;close();return;}if(e.target.id==='tasks-button')open();if(['close-workbench','backdrop'].includes(e.target.id))close();if(e.target.id==='new-session')notify('Concept only: this would open the New Session chooser.');});
  document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!$('workbench').hidden){e.preventDefault();if(composer){composer=null;details()}else close()}if(e.code==='Space'&&e.ctrlKey){e.preventDefault();$('workbench').hidden?open():close()}if(!$('workbench').hidden&&document.activeElement?.classList.contains('task-row')&&(e.key==='ArrowDown'||e.key==='ArrowUp')){e.preventDefault();selected=(selected+(e.key==='ArrowDown'?1:-1)+tasks.length)%tasks.length;composer=null;render();document.querySelector(`[data-task="${selected}"]`).focus();}});
  $('terminal-lines').innerHTML=sessionLines[session];render();
})();
</script>
</body>
