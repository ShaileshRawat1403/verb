name: Build Verb terminal bootstrap

on:
  workflow_dispatch:
    inputs:
      profile:
        description: >-
          Source builds are one-time release operations and can take hours. Select
          preflight-only for normal development.
        required: true
        default: preflight-only
        type: choice
        options:
          - preflight-only
          - core-shell-git-release
          - developer-runtime-release

permissions:
  contents: read

concurrency:
  group: verb-terminal-bootstrap
  cancel-in-progress: false

jobs:
  preflight:
    name: Validate Verb bootstrap inputs
    runs-on: ubuntu-latest
    steps:
      - name: Check out Verb runtime definitions
        uses: actions/checkout@v4

      - name: Check out pinned Termux package sources
        uses: actions/checkout@v4
        with:
          repository: termux/termux-packages
          ref: bd2e956e639090779a728c96fcca2e387dd3a246
          path: termux-packages

      - name: Validate the exact runtime patch set
        working-directory: termux-packages
        run: |
          git apply --check "$GITHUB_WORKSPACE/runtime/termux-packages/verb-app-id.patch"
          git apply --check "$GITHUB_WORKSPACE/runtime/termux-packages/verb-bootstrap-minimal.patch"
          git apply "$GITHUB_WORKSPACE/runtime/termux-packages/verb-app-id.patch"
          git apply "$GITHUB_WORKSPACE/runtime/termux-packages/verb-bootstrap-minimal.patch"
          git diff --check
          test -f packages/libbz2/build.sh
          ! grep -Fq 'PACKAGES+=("bzip2")' scripts/build-bootstraps.sh
          ! grep -Fq 'termux-am' packages/termux-tools/build.sh
          grep -Fq 'mv -f "${BOOTSTRAP_TMPDIR}/bootstrap-${1}.zip" "$TERMUX_BUILT_DEBS_DIRECTORY/"' scripts/build-bootstraps.sh
          ! grep -Fq 'codeberg.org/dnkl/foot' packages/ncurses/build.sh
          ! grep -Fq 'x11-packages/kitty/build.sh' packages/ncurses/build.sh
          ! grep -Fq 'x11-packages/alacritty/build.sh' packages/ncurses/build.sh
          ! grep -Fq 'x11-packages/foot/build.sh' packages/ncurses/build.sh
          grep -Fqx 'TERMUX_PKG_SRCURL=https://archive.apache.org/dist/apr/apr-util-${TERMUX_PKG_VERSION}.tar.gz' packages/apr-util/build.sh
          ! grep -Fq 'downloads.apache.org/apr/apr-util' packages/apr-util/build.sh
          curl --fail --silent --show-error --location --head --retry 2 --connect-timeout 10 \
            'https://archive.apache.org/dist/apr/apr-util-1.6.3.tar.gz' > /dev/null
          grep -Fqx 'TERMUX_PKG_SRCURL="https://download-mirror.savannah.gnu.org/releases/attr/attr-${TERMUX_PKG_VERSION}.tar.gz"' packages/attr/build.sh
          ! grep -Fq 'http://download.savannah.gnu.org/releases/attr' packages/attr/build.sh
          curl --fail --silent --show-error --location --head --retry 2 --connect-timeout 10 \
            'https://download-mirror.savannah.gnu.org/releases/attr/attr-2.6.0.tar.gz' > /dev/null

      - name: Validate cache-output isolation
        run: |
          set -euo pipefail
          scratch=$(mktemp -d)
          trap 'rm -rf "$scratch"' EXIT

          mkdir "$scratch/preserved" "$scratch/legacy"
          touch "$scratch/preserved/current-profile.deb" "$scratch/legacy/stale-profile.deb"
          bash runtime/scripts/prepare-bootstrap-output-cache.sh "$scratch/preserved" ''
          test -f "$scratch/preserved/current-profile.deb"
          bash runtime/scripts/prepare-bootstrap-output-cache.sh "$scratch/legacy" 'legacy-prefix-match'
          test -z "$(find "$scratch/legacy" -mindepth 1 -maxdepth 1 -print -quit)"

  build-aarch64:
    name: Build Verb aarch64 userland
    needs: preflight
    if: inputs.profile != 'preflight-only'
    runs-on: ubuntu-latest
    steps:
      - name: Check out Verb runtime definitions
        uses: actions/checkout@v4

      - name: Check out pinned Termux package sources
        uses: actions/checkout@v4
        with:
          repository: termux/termux-packages
          ref: bd2e956e639090779a728c96fcca2e387dd3a246
          path: termux-packages

      # The package-builder extracts every .deb in its output directory into the
      # bootstrap. Keep compiled sources/intermediates reusable, but never share
      # package output between runtime profiles: doing so can silently turn the
      # small core image into a developer image.
      - name: Restore native build cache
        id: restore-native-build-cache
        uses: actions/cache/restore@v4
        with:
          path: .termux-build-cache
          key: verb-termux-build-aarch64-bd2e956e-v1-${{ hashFiles('runtime/termux-packages/*.patch', '.github/workflows/build-verb-terminal-bootstrap.yml') }}-${{ github.run_id }}
          restore-keys: |
            verb-termux-build-aarch64-bd2e956e-v1-${{ hashFiles('runtime/termux-packages/*.patch', '.github/workflows/build-verb-terminal-bootstrap.yml') }}-
            verb-termux-build-aarch64-bd2e956e-v1-

      - name: Restore selected runtime output cache
        id: restore-runtime-output-cache
        uses: actions/cache/restore@v4
        with:
          path: .termux-output-cache
          key: verb-termux-output-aarch64-${{ inputs.profile }}-bd2e956e-v1-${{ hashFiles('runtime/termux-packages/*.patch', '.github/workflows/build-verb-terminal-bootstrap.yml') }}-${{ github.run_id }}
          # Deliberately no broad fallback: output .debs define the contents of
          # the generated bootstrap and must never cross a profile boundary.
          restore-keys: |
            verb-termux-output-aarch64-${{ inputs.profile }}-bd2e956e-v1-${{ hashFiles('runtime/termux-packages/*.patch', '.github/workflows/build-verb-terminal-bootstrap.yml') }}-
            verb-termux-output-aarch64-${{ inputs.profile }}-bd2e956e-v1-

      # One-time migration: the former cache combined build intermediates and
      # output packages. Reuse only its expensive compiled-source work, then
      # delete its output directory before the bootstrap script sees it.
      - name: Restore legacy compiled-source cache
        id: restore-legacy-cache
        if: ${{ steps.restore-native-build-cache.outputs.cache-hit != 'true' && steps.restore-runtime-output-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/restore@v4
        with:
          path: |
            .termux-build-cache
            .termux-output-cache
          key: verb-termux-aarch64-bd2e956e-v2-migration-${{ github.run_id }}
          restore-keys: |
            verb-termux-aarch64-bd2e956e-v2-

      - name: Prepare writable container mounts
        run: |
          bash runtime/scripts/prepare-bootstrap-output-cache.sh \
            .termux-output-cache \
            "${{ steps.restore-legacy-cache.outputs.cache-matched-key }}"
          mkdir -p .termux-build-cache
          # The package-builder runs as its unprivileged `builder` user while
          # Actions owns the checkout. Make the shared roots writable so the
          # generated bootstrap can be copied back for artifact upload.
          chmod -R a+rwX termux-packages .termux-build-cache .termux-output-cache

      - name: Verify selected runtime output is clean
        if: ${{ steps.restore-legacy-cache.outputs.cache-matched-key != '' }}
        run: test -z "$(find .termux-output-cache -mindepth 1 -maxdepth 1 -print -quit)"

      - name: Apply Verb runtime patches
        working-directory: termux-packages
        run: |
          git apply "$GITHUB_WORKSPACE/runtime/termux-packages/verb-app-id.patch"
          # The upstream termux-am Android companion requires a Gradle SDK installation that
          # cannot run in the pinned package-builder image. It is not needed for a standalone
          # local CLI, so exclude it (and its socket companion) from Verb's first bootstrap.
          git apply "$GITHUB_WORKSPACE/runtime/termux-packages/verb-bootstrap-minimal.patch"

      - name: Build matching Termux package-builder image
        working-directory: termux-packages
        run: docker build -t ghcr.io/termux/package-builder:latest scripts/

      - name: Select reviewed runtime profile
        id: runtime-profile
        run: |
          case "${{ inputs.profile }}" in
            core-shell-git-release)
              echo 'packages=ca-certificates,libcurl,git' >> "$GITHUB_OUTPUT"
              ;;
            developer-runtime-release)
              # OpenSSH is intentionally not part of the first userland. Its Kerberos
              # source is an optional dependency and made run #20 fail after hours of
              # successful compilation when kerberos.org timed out. Git over HTTPS
              # remains available; SSH is a future independently-built add-on.
              echo 'packages=ca-certificates,libcurl,git,nodejs-lts,npm,python' >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "Unsupported runtime profile: ${{ inputs.profile }}" >&2
              exit 1
              ;;
          esac

      - name: Build isolated bootstrap
        working-directory: termux-packages
        env:
          TERMUX_DOCKER_RUN_EXTRA_ARGS: >-
            --volume ${{ github.workspace }}/.termux-build-cache:/home/builder/.termux-build
            --volume ${{ github.workspace }}/.termux-output-cache:/home/builder/termux-packages/output
          TERMUX_DOCKER_EXEC_EXTRA_ARGS: --workdir /home/builder/termux-packages
        run: >-
          ./scripts/run-docker.sh ./scripts/build-bootstraps.sh
          --architectures aarch64
          --add ${{ steps.runtime-profile.outputs.packages }}

      - name: Verify runtime profile and record manifest
        run: |
          set -euo pipefail
          archive=.termux-output-cache/bootstrap-aarch64.zip
          manifest=.termux-output-cache/verb-runtime-aarch64-packages.txt
          checksum=.termux-output-cache/bootstrap-aarch64.zip.sha256

          test -s "$archive"
          unzip -t "$archive" > /dev/null
          unzip -p "$archive" var/lib/dpkg/status \
            | awk '/^Package: / { print $2 }' \
            | LC_ALL=C sort -u > "$manifest"
          test -s "$manifest"
          sha256sum "$archive" | awk '{ print $1 "  bootstrap-aarch64.zip" }' > "$checksum"

          require_package() {
            if ! grep -Fqx -- "$1" "$manifest"; then
              echo "Required package missing from generated bootstrap: $1" >&2
              exit 1
            fi
          }

          forbid_package() {
            if grep -Fqx -- "$1" "$manifest"; then
              echo "Package forbidden by the selected runtime profile: $1" >&2
              exit 1
            fi
          }

          for package in ca-certificates libcurl git; do
            require_package "$package"
          done
          forbid_package openssh

          case "${{ inputs.profile }}" in
            core-shell-git-release)
              # The upstream bootstrap always includes command-not-found. At this
              # pinned Termux revision its dependency closure includes Python, so
              # Python is not a reliable discriminator for this profile. Node and
              # npm are the developer-only additions that must stay out of core.
              for forbidden in nodejs-lts npm; do
                forbid_package "$forbidden"
              done
              ;;
            developer-runtime-release)
              for required in nodejs-lts npm python; do
                require_package "$required"
              done
              ;;
            *)
              echo "Unsupported runtime profile: ${{ inputs.profile }}" >&2
              exit 1
              ;;
          esac

      - name: Upload signed-review bootstrap artifact
        uses: actions/upload-artifact@v4
        with:
          name: verb-bootstrap-aarch64
          path: |
            .termux-output-cache/bootstrap-aarch64.zip
            .termux-output-cache/bootstrap-aarch64.zip.sha256
            .termux-output-cache/verb-runtime-aarch64-packages.txt
          if-no-files-found: error
          retention-days: 14

      - name: Save native build cache
        if: ${{ success() && steps.restore-native-build-cache.outputs.cache-hit != 'true' }}
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: .termux-build-cache
          key: verb-termux-build-aarch64-bd2e956e-v1-${{ hashFiles('runtime/termux-packages/*.patch', '.github/workflows/build-verb-terminal-bootstrap.yml') }}-${{ github.run_id }}

      - name: Save selected runtime output cache
        if: ${{ success() && steps.restore-runtime-output-cache.outputs.cache-hit != 'true' }}
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: .termux-output-cache
          key: verb-termux-output-aarch64-${{ inputs.profile }}-bd2e956e-v1-${{ hashFiles('runtime/termux-packages/*.patch', '.github/workflows/build-verb-terminal-bootstrap.yml') }}-${{ github.run_id }}
