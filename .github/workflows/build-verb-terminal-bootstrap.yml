name: Build Verb terminal bootstrap

on:
  workflow_dispatch:
    inputs:
      profile:
        description: >-
          Source builds are one-time release operations and can take hours. Select
          preflight-only for normal development.
        required: true
        default: preflight-only
        type: choice
        options:
          - preflight-only
          - core-shell-git-release
          - developer-runtime-release

permissions:
  contents: read

concurrency:
  group: verb-terminal-bootstrap
  cancel-in-progress: false

jobs:
  preflight:
    name: Validate Verb bootstrap inputs
    runs-on: ubuntu-latest
    steps:
      - name: Check out Verb runtime definitions
        uses: actions/checkout@v4

      - name: Check out pinned Termux package sources
        uses: actions/checkout@v4
        with:
          repository: termux/termux-packages
          ref: bd2e956e639090779a728c96fcca2e387dd3a246
          path: termux-packages

      - name: Validate the exact runtime patch set
        working-directory: termux-packages
        run: |
          git apply --check "$GITHUB_WORKSPACE/runtime/termux-packages/verb-app-id.patch"
          git apply --check "$GITHUB_WORKSPACE/runtime/termux-packages/verb-bootstrap-minimal.patch"
          git apply "$GITHUB_WORKSPACE/runtime/termux-packages/verb-app-id.patch"
          git apply "$GITHUB_WORKSPACE/runtime/termux-packages/verb-bootstrap-minimal.patch"
          git diff --check
          test -f packages/libbz2/build.sh
          ! grep -Fq 'PACKAGES+=("bzip2")' scripts/build-bootstraps.sh
          ! grep -Fq 'termux-am' packages/termux-tools/build.sh
          ! grep -Fq 'codeberg.org/dnkl/foot' packages/ncurses/build.sh
          ! grep -Fq 'x11-packages/kitty/build.sh' packages/ncurses/build.sh
          ! grep -Fq 'x11-packages/alacritty/build.sh' packages/ncurses/build.sh
          ! grep -Fq 'x11-packages/foot/build.sh' packages/ncurses/build.sh
          grep -Fqx 'TERMUX_PKG_SRCURL=https://archive.apache.org/dist/apr/apr-util-${TERMUX_PKG_VERSION}.tar.gz' packages/apr-util/build.sh
          ! grep -Fq 'downloads.apache.org/apr/apr-util' packages/apr-util/build.sh
          curl --fail --silent --show-error --location --head --retry 2 --connect-timeout 10 \
            'https://archive.apache.org/dist/apr/apr-util-1.6.3.tar.gz' > /dev/null
          grep -Fqx 'TERMUX_PKG_SRCURL="https://download-mirror.savannah.gnu.org/releases/attr/attr-${TERMUX_PKG_VERSION}.tar.gz"' packages/attr/build.sh
          ! grep -Fq 'http://download.savannah.gnu.org/releases/attr' packages/attr/build.sh
          curl --fail --silent --show-error --location --head --retry 2 --connect-timeout 10 \
            'https://download-mirror.savannah.gnu.org/releases/attr/attr-2.6.0.tar.gz' > /dev/null

  build-aarch64:
    name: Build Verb aarch64 userland
    needs: preflight
    if: inputs.profile != 'preflight-only'
    runs-on: ubuntu-latest
    steps:
      - name: Check out Verb runtime definitions
        uses: actions/checkout@v4

      - name: Check out pinned Termux package sources
        uses: actions/checkout@v4
        with:
          repository: termux/termux-packages
          ref: bd2e956e639090779a728c96fcca2e387dd3a246
          path: termux-packages

      - name: Restore native build cache
        id: restore-termux-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            .termux-build-cache
            .termux-output-cache
          key: verb-termux-aarch64-bd2e956e-v2-${{ hashFiles('runtime/termux-packages/*.patch', '.github/workflows/build-verb-terminal-bootstrap.yml') }}-${{ github.run_id }}
          # A source-host URL replacement does not invalidate already-built
          # packages. The broader fallback restores the compatible ABI cache;
          # Termux still builds the unbuilt or changed package.
          restore-keys: |
            verb-termux-aarch64-bd2e956e-v2-${{ hashFiles('runtime/termux-packages/*.patch', '.github/workflows/build-verb-terminal-bootstrap.yml') }}-
            verb-termux-aarch64-bd2e956e-v2-

      - name: Prepare writable container mounts
        run: |
          mkdir -p .termux-build-cache .termux-output-cache
          # The package-builder runs as its unprivileged `builder` user while
          # Actions owns the checkout. Make the shared roots writable so the
          # generated bootstrap can be copied back for artifact upload.
          chmod -R a+rwX termux-packages .termux-build-cache .termux-output-cache

      - name: Apply Verb runtime patches
        working-directory: termux-packages
        run: |
          git apply "$GITHUB_WORKSPACE/runtime/termux-packages/verb-app-id.patch"
          # The upstream termux-am Android companion requires a Gradle SDK installation that
          # cannot run in the pinned package-builder image. It is not needed for a standalone
          # local CLI, so exclude it (and its socket companion) from Verb's first bootstrap.
          git apply "$GITHUB_WORKSPACE/runtime/termux-packages/verb-bootstrap-minimal.patch"

      - name: Build matching Termux package-builder image
        working-directory: termux-packages
        run: docker build -t ghcr.io/termux/package-builder:latest scripts/

      - name: Select reviewed runtime profile
        id: runtime-profile
        run: |
          case "${{ inputs.profile }}" in
            core-shell-git-release)
              echo 'packages=ca-certificates,libcurl,git' >> "$GITHUB_OUTPUT"
              ;;
            developer-runtime-release)
              # OpenSSH is intentionally not part of the first userland. Its Kerberos
              # source is an optional dependency and made run #20 fail after hours of
              # successful compilation when kerberos.org timed out. Git over HTTPS
              # remains available; SSH is a future independently-built add-on.
              echo 'packages=ca-certificates,libcurl,git,nodejs-lts,npm,python' >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "Unsupported runtime profile: ${{ inputs.profile }}" >&2
              exit 1
              ;;
          esac

      - name: Build isolated bootstrap
        working-directory: termux-packages
        env:
          TERMUX_DOCKER_RUN_EXTRA_ARGS: >-
            --volume ${{ github.workspace }}/.termux-build-cache:/home/builder/.termux-build
            --volume ${{ github.workspace }}/.termux-output-cache:/home/builder/termux-packages/output
          TERMUX_DOCKER_EXEC_EXTRA_ARGS: --workdir /home/builder/termux-packages
        run: >-
          ./scripts/run-docker.sh ./scripts/build-bootstraps.sh
          --architectures aarch64
          --add ${{ steps.runtime-profile.outputs.packages }}

      - name: Upload signed-review bootstrap artifact
        uses: actions/upload-artifact@v4
        with:
          name: verb-bootstrap-aarch64
          path: termux-packages/bootstrap-aarch64.zip
          if-no-files-found: error
          retention-days: 14

      - name: Save native build cache
        if: ${{ always() && steps.restore-termux-cache.outputs.cache-hit != 'true' }}
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: |
            .termux-build-cache
            .termux-output-cache
          key: verb-termux-aarch64-bd2e956e-v2-${{ hashFiles('runtime/termux-packages/*.patch', '.github/workflows/build-verb-terminal-bootstrap.yml') }}-${{ github.run_id }}
