name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        flavor: [FullCli, Play]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Unit test (${{ matrix.flavor }})
        run: ./gradlew :app:test${{ matrix.flavor }}DebugUnitTest

      - name: Lint (${{ matrix.flavor }})
        run: ./gradlew :app:lint${{ matrix.flavor }}Debug

      - name: Assemble debug APK (${{ matrix.flavor }})
        run: ./gradlew :app:assemble${{ matrix.flavor }}Debug

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports-${{ matrix.flavor }}
          path: |
            app/build/reports/tests/
            app/build/reports/lint-results-*.html
          if-no-files-found: ignore
          retention-days: 14
