name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        flavor: [FullCli, Play]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Java
        uses: actions/setup-java@3a4f6e1af504cf6a31855fa899c6aa5355ba6c12 # v4.7.0
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@0bdd871935719febd78681f197cd39af5b6e16a6 # v4.2.2

      - name: Unit test (${{ matrix.flavor }})
        run: ./gradlew :app:test${{ matrix.flavor }}DebugUnitTest

      - name: Lint (${{ matrix.flavor }})
        run: ./gradlew :app:lint${{ matrix.flavor }}Debug

      - name: Assemble debug APK (${{ matrix.flavor }})
        run: ./gradlew :app:assemble${{ matrix.flavor }}Debug

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1 # v4.6.1
        with:
          name: reports-${{ matrix.flavor }}
          path: |
            app/build/reports/tests/
            app/build/reports/lint-results-*.html
          if-no-files-found: ignore
          retention-days: 14

  # Unit tests construct VerbViewModel and Compose screens in isolation, so they can't see two
  # classes of bug that only show up when the real Activity/ViewModel/Compose pipeline runs
  # together: the constructor blocking the first frame, and a background refresh that silently
  # never fires (an edit landing in the wrong function because two functions shared anchor text --
  # this shipped once). See app/src/androidTest/java/com/example/verb/StartupTruthTest.kt.
  #
  # fullCli only: the assertions don't depend on flavor-specific behavior, and this job's cost is
  # paid per emulator boot, not per flavor.
  device-truth:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Java
        uses: actions/setup-java@3a4f6e1af504cf6a31855fa899c6aa5355ba6c12 # v4.7.0
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@0bdd871935719febd78681f197cd39af5b6e16a6 # v4.2.2

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: AVD cache
        uses: actions/cache@d4323d4df104b026a6aa633fdb11d772146be0bf # v4.2.2
        id: avd-cache
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          # Bumped when the cached snapshot stopped being loadable; see the run step below.
          key: avd-30-x86_64-v2

      - name: Create AVD snapshot for caching
        if: steps.avd-cache.outputs.cache-hit != 'true'
        uses: reactivecircus/android-emulator-runner@62dbb605bba737720e10b196cb4220d374026a6d # v2.33.0
        with:
          api-level: 30
          target: google_apis
          arch: x86_64
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: false
          script: echo "AVD created"

      # `-no-snapshot-load`: two consecutive runs died with `adb: device offline` immediately after
      # "Successfully loaded snapshot 'default_boot'" -- the emulator reports itself restored while
      # adb still cannot reach it, and a re-run failed identically rather than passing, so it was
      # not a coin flip. Booting cold costs about a minute and removes that step from the path
      # entirely. The cache still earns its keep: it holds the system image and the AVD, which is
      # the slow part to create.
      - name: Run device-truth tests
        uses: reactivecircus/android-emulator-runner@62dbb605bba737720e10b196cb4220d374026a6d # v2.33.0
        with:
          api-level: 30
          target: google_apis
          arch: x86_64
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -no-snapshot-load
          emulator-boot-timeout: 900
          disable-animations: true
          script: ./gradlew :app:connectedFullCliDebugAndroidTest

      - name: Upload instrumented test reports
        if: always()
        uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1 # v4.6.1
        with:
          name: reports-device-truth
          path: app/build/reports/androidTests/
          if-no-files-found: ignore
          retention-days: 14

  desktop:
    # Unit tests plus integration tests that run a real shell on a real PTY, a real Git repository
    # and the local web host. macOS runs too: PTY, process-group and path behaviour differ there,
    # and it is the platform the desktop host is mostly used on.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Rust
        # Each component needs its own flag: rustup reads a bare second word as a toolchain name
        # and fails with "invalid toolchain name: 'rustfmt'".
        run: rustup toolchain install stable --profile minimal --component clippy --component rustfmt

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: desktop/web/package-lock.json

      - name: Build browser assets embedded by Rust
        run: |
          npm ci --prefix web
          npm run build --prefix web
          git diff --exit-code -- web/dist

      - name: Cache cargo
        uses: actions/cache@d4323d4df104b026a6aa633fdb11d772146be0bf # v4.2.2
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            desktop/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('desktop/Cargo.lock') }}

      - name: Format
        if: matrix.os == 'ubuntu-latest'
        run: cargo fmt --check

      - name: Clippy
        if: matrix.os == 'ubuntu-latest'
        run: cargo clippy --all-targets -- -D warnings

      - name: Test
        # Includes tests/shell_integration.rs, which instruments a real bash and zsh. Both exist on
        # the runner; the tests skip themselves rather than fail if a shell is missing.
        run: cargo test --all-targets

      - name: Build release
        run: cargo build --release
