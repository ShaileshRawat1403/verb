name: Release Full CLI

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag, for example v1.0.0"
        required: true
        type: string
      prerelease:
        description: "Mark this as a prerelease"
        required: true
        default: true
        type: boolean

permissions:
  contents: write

jobs:
  verify:
    uses: ./.github/workflows/ci.yml

  release:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Decode signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/verb-upload.jks"

      - name: Build signed Full CLI APK
        env:
          KEYSTORE_PATH: ${{ runner.temp }}/verb-upload.jks
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew :app:assembleFullCliRelease

      - name: Generate checksum
        run: sha256sum app/build/outputs/apk/fullCli/release/app-fullCli-release.apk > app/build/outputs/apk/fullCli/release/verb-full-cli.apk.sha256

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          prerelease: ${{ inputs.prerelease || false }}
          generate_release_notes: true
          files: |
            app/build/outputs/apk/fullCli/release/app-fullCli-release.apk
            app/build/outputs/apk/fullCli/release/verb-full-cli.apk.sha256
