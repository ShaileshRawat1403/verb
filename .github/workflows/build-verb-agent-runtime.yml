name: Build Verb Agent Runtime

on:
  workflow_dispatch:
  push:
    paths:
      - 'runtime/agent-runtime/**'
      - '.github/workflows/build-verb-agent-runtime.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      RUNTIME_VERSION: 0.1.0
      NODE_VERSION: 24.18.0
      CLAUDE_VERSION: 2.1.233
      OPENCODE_VERSION: 1.18.18
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64
      - uses: docker/setup-buildx-action@v3
      - name: Build pinned ARM64 Linux image
        run: |
          docker buildx build --platform linux/arm64 --load \
            --build-arg NODE_VERSION \
            --build-arg CLAUDE_VERSION \
            --build-arg OPENCODE_VERSION \
            -t verb-agent-runtime:\${RUNTIME_VERSION} runtime/agent-runtime
      - name: Export and verify rootfs
        run: |
          mkdir -p out
          container=\$(docker create verb-agent-runtime:\${RUNTIME_VERSION})
          docker export "\$container" | gzip -n > out/agent-runtime-rootfs.tar.gz
          docker rm "\$container"
          sha256sum out/agent-runtime-rootfs.tar.gz > out/agent-runtime-rootfs.tar.gz.sha256
          printf '%s\n' \
            "runtimeVersion=\${RUNTIME_VERSION}" \
            "architecture=aarch64" \
            "nodeVersion=\${NODE_VERSION}" \
            "claudeVersion=\${CLAUDE_VERSION}" \
            "openCodeVersion=\${OPENCODE_VERSION}" \
            "rootfsSha256=\$(cut -d' ' -f1 out/agent-runtime-rootfs.tar.gz.sha256)" \
            > out/agent-runtime-manifest.txt
          tar -tzf out/agent-runtime-rootfs.tar.gz | grep -Fx 'usr/local/bin/node'
          tar -tzf out/agent-runtime-rootfs.tar.gz | grep -Fx 'usr/local/bin/claude'
          tar -tzf out/agent-runtime-rootfs.tar.gz | grep -Fx 'usr/local/bin/opencode'
      - uses: actions/upload-artifact@v4
        with:
          name: verb-agent-runtime-aarch64-\${{ env.RUNTIME_VERSION }}
          path: out/
          if-no-files-found: error
          retention-days: 14
