# cargo-about configuration for the Rust third-party notices shipped with Verb Desktop releases.
# Generate with: cargo about generate --locked about.hbs > RUST_THIRD_PARTY_NOTICES.txt
# A crate under a licence missing from `accepted` fails generation, so a new copyleft or unknown
# licence cannot slip into a release unnoticed.
targets = [
    "x86_64-unknown-linux-gnu",
    "aarch64-unknown-linux-gnu",
    "aarch64-apple-darwin",
    "x86_64-apple-darwin",
]
ignore-build-dependencies = true
ignore-dev-dependencies = true
accepted = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "MIT",
    "ISC",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "Zlib",
    "Unlicense",
    "Unicode-3.0",
    "CDLA-Permissive-2.0",
]
