# The one place Verb's Android version is declared.
#
# Gradle reads this for every build, so a local build and a release build cannot disagree about
# what they are. The release workflow overrides both values explicitly from the tag it was asked
# for, and then refuses to publish an APK whose embedded values do not match -- so forgetting to
# edit this file fails the release rather than shipping a mislabelled artifact.
#
# versionCode tracks the beta number: beta.1 was 1, beta.4 was 4, beta.5 was 5, beta.6 was 6,
# beta.7 was 7, and beta.8 is 8.
# Codes 2 and 3 were never published as distinct values -- beta.2 and beta.3 both shipped as code 1 --
# and are skipped rather than reused, because reusing them would claim a history that did not happen.
versionName=0.1.0-beta.8
versionCode=8
