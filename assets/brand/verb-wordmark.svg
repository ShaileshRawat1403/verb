<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 140" role="img" aria-label="Verb">
  <title>Verb</title>
  <!--
    The V is the shell prompt, stood upright.

    A terminal prompt is a chevron; rotate it a quarter turn and it is already the letter. So the
    mark is not a picture of a terminal bolted onto a word - it is the one glyph a terminal always
    shows, doing the job of the letter it happens to be. The block after the word is the cursor,
    which is why the wordmark reads as a line waiting for input rather than as a label.

    Geometry is mitred and flat-capped on purpose: no rounded joins anywhere, because a character
    cell has corners.
  -->
  <g fill="none" stroke="#6366F1" stroke-width="17" stroke-linecap="butt" stroke-linejoin="miter">
    <path d="M34 38 L74 96 L114 38" />
  </g>
  <text x="132" y="97"
        font-family="'JetBrains Mono','SFMono-Regular',Menlo,Consolas,'Liberation Mono',monospace"
        font-size="76" font-weight="700" letter-spacing="-1" fill="#E2E8F0">erb</text>
  <rect x="352" y="72" width="34" height="24" fill="#38BDF8"/>
</svg>
